<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caroline — Construction de produits et socles applicatifs</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        chalk: '#FAF9F6',
                        ink: '#111111',
                        stone: '#6B7280',
                        paper: '#FFFFFF'
                    },
                    fontFamily: {
                        serif: ['Cormorant Garamond', 'serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FAF9F6; color: #111111; }
        .timeline-dot::before {
            content: '';
            position: absolute;
            left: -33px;
            top: 6px;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background-color: #111111;
            border: 2px solid #FAF9F6;
            box-shadow: 0 0 0 1px #111111;
        }
        @media (max-width: 768px) {
            .timeline-dot::before { left: -21px; }
        }
    </style>
</head>

<body class="antialiased selection:bg-ink selection:text-chalk">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
